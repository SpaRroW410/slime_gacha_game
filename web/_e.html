<!doctype html><meta charset=utf-8><link rel=stylesheet href="/style.css"><script src="/avatars.js"></script><style>body{padding:12px}td,th{padding:8px 10px;text-align:center;font-size:.8rem}.blob{animation:none!important}</style><div id=o></div><script>const CLASS_COLORS = { barbarian: '#e5604d', mage: '#8a7cff', medic: '#4cc38a', rogue: '#aab2c0', ranger: '#e0b341', necromancer: '#a56bd1', bard: '#f08fc0', paladin: '#f2d36b', alchemist: '#5ec8d8', druid: '#7bb661' };
const cases=[['base',{}],['Greater',{stage:1}],['Prime',{stage:2}],['Prime + hybrid (magic)',{stage:2,disc:'magic'}],['Prime + hybrid + class mastery',{stage:2,disc:'sword',cm:1}],['all: both masteries',{stage:2,disc:'archery',cm:1,hm:1}]];
let h='<table><tr><th></th>'+cases.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>';
for(const a of ['barbarian','mage','bard','paladin','druid','alchemist']){h+='<tr><th>'+a+'</th>'+cases.map(([n,o])=>{const g=AV.gear(a,'legendary',o);return '<td><div class="blob big geared legendary m-happy" style="--c:'+CLASS_COLORS[a]+'">'+(g.back||'')+'<div class="body"><i></i><i></i></div><div class="mouth"></div>'+g.front+'</div></td>'}).join('')+'</tr>';}
document.getElementById('o').innerHTML=h+'</table>';</script>
